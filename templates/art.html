{% extends "layout.html" %} {% block content %}

<div class="card-grid">
  {% for image_file in image_files %}
  <div class="card">
    <img
      src="/{{ image_file }}"
      alt="{{ image_file }}"
      style="height: 500px; width: 100%; object-fit: contain; display: block"
    />
  </div>
  {% endfor %}
</div>
{% endblock %}
